[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "blocksmith-launcher"
version = "2.2.0"
description = "A native Python Minecraft launcher powered by PortableMC"
requires-python = ">=3.10"
dependencies = [
  "portablemc>=4.4,<5",
  "platformdirs>=4.0",
  "pypresence>=4.3,<5",
]

[project.scripts]
blocksmith = "blocksmith.app:main"

[tool.setuptools.packages.find]
include = ["blocksmith*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
